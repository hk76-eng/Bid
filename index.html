<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress Vite HMR WebSocket connection errors in iFrame / preview sandbox
      if (typeof window !== 'undefined') {
        window.addEventListener('error', function(event) {
          var msg = String((event && event.message) || '');
          var file = String((event && event.filename) || '');
          if (
            msg.includes('WebSocket') ||
            msg.includes('createWebSocketModuleRunnerTransport') ||
            msg.includes('@vite/client') ||
            file.includes('@vite/client')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = String((event && event.reason) || '');
          if (
            reason.includes('WebSocket') ||
            reason.includes('createWebSocketModuleRunnerTransport') ||
            reason.includes('@vite/client')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      }
    </script>
