<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 250" width="100" height="250">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="greenPinShadow" x="-30%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="1" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Metallic Needle Chrome Gradient -->
    <linearGradient id="needleChromeGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="20%" stop-color="#64748b" />
      <stop offset="42%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="88%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Needle Tip Chrome Gradient -->
    <linearGradient id="needleTipChromeGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="30%" stop-color="#94a3b8" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- 3D Green Sphere Radial Gradient matching uploaded marker -->
    <radialGradient id="greenSphereRadial" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="16%" stop-color="#4ade80" />
      <stop offset="38%" stop-color="#16a34a" />
      <stop offset="68%" stop-color="#15803d" />
      <stop offset="88%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>

    <!-- Green Sphere Ambient Rim Light -->
    <radialGradient id="greenSphereRim" cx="72%" cy="78%" r="48%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#22c55e" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#052e16" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ground Needle Contact Point Shadow -->
  <ellipse cx="50" cy="245" rx="9" ry="2.5" fill="#000000" opacity="0.45" />

  <g filter="url(#greenPinShadow)">
    <!-- Chrome Needle Shaft -->
    <rect x="47.5" y="66" width="5" height="158" rx="0.5" fill="url(#needleChromeGreen)" />

    <!-- Chrome Needle Sharp Point -->
    <polygon points="47.5,224 52.5,224 50,244" fill="url(#needleTipChromeGreen)" />

    <!-- Shadow / Collar where needle meets green ball -->
    <ellipse cx="50" cy="74" rx="4" ry="1.5" fill="#022c13" opacity="0.7" />

    <!-- 3D Glossy Green Ball -->
    <circle cx="50" cy="40" r="36" fill="url(#greenSphereRadial)" />

    <!-- Rim Light on lower right curve -->
    <circle cx="50" cy="40" r="36" fill="url(#greenSphereRim)" />

    <!-- Bright Crescent Gloss Reflection on top-left curve -->
    <path d="M 33 19 C 39 13, 50 11, 58 13 C 55 17, 46 21, 39 27 C 35 25, 33 22, 33 19 Z" fill="#ffffff" opacity="0.95" />

    <!-- Secondary Soft Specular Glare -->
    <ellipse cx="41" cy="25" rx="10" ry="6" transform="rotate(-28 41 25)" fill="#ffffff" opacity="0.45" />
    <circle cx="34" cy="29" r="2.5" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
